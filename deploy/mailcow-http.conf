# HTTP challenge endpoint for the dedicated hostname. Activate HTTPS only after
# DNS resolves and a certificate has been issued.
server {
    listen 80;
    server_name galactamouse.samix-technology.com;

    location ^~ /.well-known/acme-challenge/ { root /web; allow all; }
    location / { return 301 https://$host$request_uri; }
}
