    # GalacticMouse relay; place inside the samix-technology.com HTTPS server block.
    location = /galacticmouse/ws {
        proxy_pass http://172.22.1.1:4786/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location = /galacticmouse/health {
        proxy_pass http://172.22.1.1:4786/health;
    }
