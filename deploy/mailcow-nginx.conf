server {
    listen 80;
    server_name galactamouse.samix-technology.com;
    location ^~ /.well-known/acme-challenge/ { root /web; allow all; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name galactamouse.samix-technology.com;
    ssl_certificate /etc/letsencrypt/live/galactamouse.samix-technology.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/galactamouse.samix-technology.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 8k;

    location / {
        proxy_pass http://172.22.1.1:4786;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
}
