services:
  relay:
    build: .
    restart: unless-stopped
    ports:
      - "172.22.1.1:4786:8080"
    environment:
      PORT: "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
